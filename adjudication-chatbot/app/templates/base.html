<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ dept_display_name }} Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-brand-gradient shadow-sm mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="{{ url_for('chat.index') }}">
        <i class="bi bi-shield-plus me-2"></i>{{ dept_display_name }} Assistant
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        {% if user %}
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('chat.index') }}"><i class="bi bi-chat-dots me-1"></i>Chat</a></li>
          <li class="nav-item"><a class="nav-link {% if request.path.startswith('/hitl') %}active{% endif %}" href="{{ url_for('hitl.queue') }}"><i class="bi bi-clipboard-check me-1"></i>Review Queue</a></li>
          <li class="nav-item"><a class="nav-link {% if request.path.startswith('/dashboard') %}active{% endif %}" href="{{ url_for('dashboard.index') }}"><i class="bi bi-graph-up me-1"></i>Dashboard</a></li>
        </ul>
        <span class="navbar-text text-white-50 me-3 small">
          <i class="bi bi-person-circle me-1"></i>{{ user.username }} &middot; {{ user.department }}
        </span>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-1"></i>Log out</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 pb-5">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
